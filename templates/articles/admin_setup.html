<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>管理者アカウント設定</title>
</head>
<body>
    <h1>管理者アカウント設定</h1>

    {% if success %}
        <p>管理者アカウントを作成しました。</p>
        <p>ユーザー名：{{ username }}</p>
        <p>
            <a href="/admin/">Django管理画面へ</a>
        </p>
        <p>
            セットアップ機能と環境変数を削除してから
            管理画面にログインしてください。
        </p>
    {% else %}
        {% if error %}
            <p>{{ error }}</p>
        {% endif %}

        <form method="post">
            {% csrf_token %}

            <p>
                <label for="token">設定用トークン</label><br>
                <input type="password" id="token"
                       name="token" required
                       autocomplete="off">
            </p>

            <p>
                <label for="email">メールアドレス（任意）</label><br>
                <input type="email" id="email" name="email">
            </p>

            <p>
                <label for="password">管理者パスワード</label><br>
                <input type="password" id="password"
                       name="password" required
                       autocomplete="new-password">
            </p>

            <p>
                <label for="password_confirm">
                    パスワード（確認用）
                </label><br>
                <input type="password" id="password_confirm"
                       name="password_confirm" required
                       autocomplete="new-password">
            </p>

            <button type="submit">管理者を作成する</button>
        </form>
    {% endif %}
</body>
</html>
