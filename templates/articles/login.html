{% extends "base.html" %}

{% block content %}

<h2>
    ログイン
</h2>


<form method="post">

    {% csrf_token %}

    <p>

        <label>
            ユーザー名
        </label>

    </p>

    <p>

        <input
            type="text"
            name="username"
        >

    </p>


    <p>

        <label>
            パスワード
        </label>

    </p>

    <p>

        <input
            type="password"
            name="password"
        >

    </p>


    <button type="submit">
        ログイン
    </button>

</form>


<p>

    <a href="/register/">
        ユーザー登録はこちら
    </a>

</p>

{% endblock %}
