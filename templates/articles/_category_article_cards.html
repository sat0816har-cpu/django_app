{% for article in articles %}
    <article class="post-card">
        <a href="/articles/{{ article.id }}/" class="post-card-link">

            {% if article.image %}
                <img
                    class="post-image"
                    src="{{ article.image.url }}"
                    alt="{{ article.title }}"
                    loading="lazy"
                >
            {% else %}
                <div class="post-no-image">
                    <span>写真はありません</span>
                </div>
            {% endif %}

            <div class="post-card-body">
                <h3 class="post-card-title">
                    {{ article.title }}
                </h3>

                <p class="post-author">
                    {{ article.author.username }}
                </p>

                <p class="post-date">
                    {{ article.created_at|date:"Y年n月j日" }}
                </p>
            </div>

        </a>
    </article>
{% endfor %}
