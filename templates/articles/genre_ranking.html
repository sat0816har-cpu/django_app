
{% extends "base.html" %}

{% block content %}

<div class="container">

    <h2>{{ ranking_title }}</h2>

    <div class="genre-ranking-menu">
        {% for slug, name in genre_choices %}
            <a
                href="{% url 'genre_ranking' genre_slug=slug %}"
                class="genre-ranking-link {% if selected_genre == slug %}active{% endif %}"
            >
                {{ name }}
            </a>
        {% endfor %}
    </div>

    <div class="post-grid" id="post-grid">

        {% include "articles/_article_cards.html" %}

        {% if not articles %}
            <p class="empty-message">
                このジャンルには、まだ記事がありません。
            </p>
        {% endif %}

    </div>

    <p>
        <a href="/">ホームに戻る</a>
    </p>

</div>

{% endblock %}
