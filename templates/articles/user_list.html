
<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>登録ユーザー一覧</title>
</head>
<body>
    <h1>登録ユーザー一覧</h1>

    <p>登録者数：{{ users|length }}人</p>

    <table border="1" cellpadding="8">
        <thead>
            <tr>
                <th>ユーザー名</th>
                <th>メールアドレス</th>
                <th>登録日時</th>
            </tr>
        </thead>
        <tbody>
            {% for user in users %}
                <tr>
                    <td>{{ user.username }}</td>
                    <td>{{ user.email|default:"未登録" }}</td>
                    <td>{{ user.date_joined|date:"Y年m月d日 H:i" }}</td>
                </tr>
            {% empty %}
                <tr>
                    <td colspan="3">登録ユーザーはいません。</td>
                </tr>
            {% endfor %}
        </tbody>
    </table>

    　　<form method="post">
    {% csrf_token %}
    <button type="submit" name="action" value="logout">
        一覧を閉じる
    </button>
</form>
    
</body>
</html>
