
{% extends "base.html" %}

{% block content %}

<div class="feed-header">
    <h2 class="feed-title">{{ category_name }}</h2>
    <p class="feed-description">
        {{ category_name }}の投稿を見てみましょう。
    </p>
</div>

{% if articles %}
    <div class="post-grid" id="category-article-grid">
        {% include "articles/_category_article_cards.html" %}
    </div>

    {% if page_obj.has_next %}
        <div style="text-align: center; margin-top: 25px;">
            <button
                id="load-more-category-articles"
                type="button"
                data-next-page="{{ page_obj.next_page_number }}"
                style="padding: 10px 28px; border: 1px solid #dddddd; border-radius: 25px; background: #ffffff; color: #555555; font-size: 15px; cursor: pointer;"
            >
                もっと見る
            </button>
        </div>
    {% endif %}

{% else %}
    <p class="empty-message">
        まだ投稿がありません。
        このカテゴリーの最初の記事を投稿してみましょう！
    </p>
{% endif %}



<script>
document.addEventListener("DOMContentLoaded", function () {
    const button = document.getElementById(
        "load-more-category-articles"
    );
    const grid = document.getElementById(
        "category-article-grid"
    );

    if (!button || !grid) {
        return;
    }

    button.addEventListener("click", async function () {
        const nextPage = Number(button.dataset.nextPage);

        if (!nextPage || button.disabled) {
            return;
        }

        button.disabled = true;
        button.textContent = "読み込み中...";

        try {
            const url = new URL(window.location.href);
            url.searchParams.set("page", nextPage);
            url.searchParams.set("partial", "1");

            const response = await fetch(url.toString());

            if (!response.ok) {
                throw new Error(
                    "読み込みに失敗しました: " + response.status
                );
            }

            const html = await response.text();
            const template = document.createElement("template");
            template.innerHTML = html;

            const cards = template.content.querySelectorAll(
                ".post-card"
            );

            if (cards.length === 0) {
                button.remove();
                return;
            }

            cards.forEach(function (card) {
                grid.appendChild(card);
            });

            // 12枚未満なら最後のページ
            if (cards.length < 12) {
                button.remove();
            } else {
                button.dataset.nextPage = nextPage + 1;
                button.disabled = false;
                button.textContent = "もっと見る";
            }

        } catch (error) {
            console.error(error);
            button.disabled = false;
            button.textContent = "もう一度試す";
        }
    });
});
</script>



{% endblock %}
