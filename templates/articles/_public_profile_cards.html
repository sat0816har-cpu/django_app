{% for article in articles %}
    <div class="public-profile-card">

        
        <a href="/articles/{{ article.id }}/">
            {% if article.image %}
                <img
                    src="{{ article.image.url }}"
                    alt="{{ article.title }}"
                    loading="lazy"
                >
            {% else %}
                <img
                    src="{% static 'images/default_article.jpg' %}"
                    alt="記事のイメージ画像"
                    loading="lazy"
                >
            {% endif %}
        </a>


        <h3>
            <a
                href="/articles/{{ article.id }}/"
                style="color: inherit;"
            >
                {{ article.title }}
            </a>
        </h3>

        <p style="color: #777777; font-size: 12px;">
            {{ article.created_at|date:"Y年n月j日" }}
        </p>

        <p style="font-size: 12px;">
            {{ article.get_genre_display }} /
            {{ article.get_category_display }}
        </p>

        <p style="font-size: 14px;">
            {{ article.content|truncatechars:70 }}
        </p>

        <a
            href="/articles/{{ article.id }}/"
            style="font-size: 14px;"
        >
            記事を読む →
        </a>

        <div class="post-card-likes">
            <input
                type="hidden"
                class="csrf-token"
                value="{{ csrf_token }}"
            >

            <button
                type="button"
                class="like-button"
                data-like-url="{% url 'article_like' article.id %}"
                aria-label="この記事にいいね"
            >
                <span class="like-heart">♡</span>
                <span class="like-label">いいね</span>
                <span class="like-count">{{ article.like_count }}</span>
            </button>
        </div>

    </div>
{% endfor %}

<div id="has-next-page" data-has-next="{{ has_next|yesno:'true,false' }}" hidden></div>
