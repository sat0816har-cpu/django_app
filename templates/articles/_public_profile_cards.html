
{% for article in articles %}
    <div class="public-profile-card">
        {% if article.image %}
            <a href="/articles/{{ article.id }}/">
                <img
                    src="{{ article.image.url }}"
                    alt="{{ article.title }}"
                >
            </a>
        {% endif %}

        <h3>
            <a
                href="/articles/{{ article.id }}/"
                style="color: inherit;"
            >
                {{ article.title }}
            </a>
        </h3>

        <p style="color: #777777; font-size: 12px;">
            {{ article.created_at|date:"Y年n月j日" }}
        </p>

        <p style="font-size: 12px;">
            {{ article.get_genre_display }} /
            {{ article.get_category_display }}
        </p>

        <p style="font-size: 14px;">
            {{ article.content|truncatechars:70 }}
        </p>

        <a
            href="/articles/{{ article.id }}/"
            style="font-size: 14px;"
        >
            記事を読む →
        </a>
    </div>
{% endfor %}

<div id="has-next-page" data-has-next="{{ has_next|yesno:'true,false' }}" hidden></div>
