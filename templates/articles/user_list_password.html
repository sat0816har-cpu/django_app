
<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>登録ユーザー一覧・ログイン</title>
</head>
<body>
    <h1>登録ユーザー一覧</h1>

    {% if error %}
        <p>{{ error }}</p>
    {% endif %}

    <form method="post">
        {% csrf_token %}
        <p>
            <label for="password">確認用パスワード</label>
        </p>
        <p>
            <input type="password" id="password"
                   name="password" required>
        </p>
        <button type="submit">一覧を表示</button>
    </form>

    
<p>
    <a href="/">記事一覧に戻る</a>
</p>

　　<form method="post">
    {% csrf_token %}
    <button type="submit" name="action" value="logout">
        一覧を閉じる
    </button>
</form>

</body>
</html>
