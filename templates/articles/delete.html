```html
{% extends "base.html" %}

{% block content %}

<style>
    .delete-container {
        width: 100%;
        max-width: 560px;
        margin: 30px auto;
        padding: 0 16px;
        box-sizing: border-box;
    }

    .delete-card {
        background: #fff;
        border: 1px solid #e5e7eb;
        border-radius: 12px;
        padding: 28px 24px;
        box-sizing: border-box;
        text-align: center;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
    }

    .delete-icon {
        font-size: 36px;
        margin-bottom: 12px;
    }

    .delete-title {
        margin: 0 0 16px;
        font-size: 22px;
        line-height: 1.5;
        color: #333;
    }

    .delete-message {
        margin: 0 0 20px;
        color: #666;
        font-size: 15px;
        line-height: 1.8;
    }

    .delete-article-title {
        margin: 0 0 24px;
        padding: 14px;
        background: #f8fafc;
        border: 1px solid #e5e7eb;
        border-radius: 8px;
        color: #333;
        font-size: 16px;
        font-weight: bold;
        line-height: 1.7;
        overflow-wrap: anywhere;
    }

    .delete-actions {
        display: flex;
        justify-content: center;
        gap: 12px;
        flex-wrap: wrap;
    }

    .delete-button,
    .cancel-button {
        display: inline-block;
        min-width: 140px;
        padding: 12px 20px;
        border-radius: 8px;
        font-size: 15px;
        font-weight: bold;
        text-align: center;
        text-decoration: none;
        box-sizing: border-box;
        cursor: pointer;
        transition: background 0.2s;
    }

    .delete-button {
        background: #dc3545;
        color: #fff;
        border: none;
    }

    .delete-button:hover {
        background: #bb2d3b;
    }

    .cancel-button {
        background: #f1f5f9;
        color: #334155;
        border: 1px solid #cbd5e1;
    }

    .cancel-button:hover {
        background: #e2e8f0;
    }

    @media (max-width: 480px) {
        .delete-container {
            margin: 16px auto;
            padding: 0 10px;
        }

        .delete-card {
            padding: 24px 16px;
        }

        .delete-title {
            font-size: 20px;
        }

        .delete-actions {
            flex-direction: column;
        }

        .delete-button,
        .cancel-button {
            width: 100%;
        }
    }
</style>

<div class="delete-container">
    <div class="delete-card">

        <div class="delete-icon">⚠️</div>

        <h2 class="delete-title">
            記事を削除しますか？
        </h2>

        <p class="delete-message">
            この記事を削除すると、元に戻すことはできません。
        </p>

        <p class="delete-article-title">
            {{ article.title }}
        </p>

        <div class="delete-actions">

            <form method="post">
                {% csrf_token %}

                <button type="submit" class="delete-button">
                    削除する
                </button>
            </form>

            <a href="/articles/{{ article.id }}/"
               class="cancel-button">
                キャンセル
            </a>

        </div>

    </div>
</div>

{% endblock %}
```
