
{% for article in articles %}

    <article class="post-card">
        <a href="/articles/{{ article.id }}/"
           class="post-card-link">

            {% if article.image %}
                <img
                    class="post-image"
                    src="{{ article.image.url }}"
                    alt="{{ article.title }}"
                    loading="lazy"
                >
            {% else %}
                <div class="post-no-image">
                    <span>写真はありません</span>
                </div>
            {% endif %}

            <div class="post-card-body">
                <h3 class="post-card-title">
                    {{ article.title }}
                </h3>

                <div class="post-card-meta">
                    <span class="post-genre">
                        {{ article.get_genre_display }}
                    </span>

                    <span class="post-category">
                        {{ article.get_category_display }}
                    </span>
                </div>

                <p class="post-author">
                    {{ article.author.username }}
                </p>

                <p class="post-date">
                    {{ article.created_at|date:"Y年n月j日" }}
                </p>
            </div>
        </a>
    </article>

{% endfor %}

<span
    id="load-more-status"
    data-has-next="{{ has_next|yesno:'true,false' }}"
    hidden
></span>
