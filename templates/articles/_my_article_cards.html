
{% for article in articles %}

    <a href="/articles/{{ article.id }}/?from=my-articles"
       class="article-card-link">

        <article class="article-card">

            {% if article.image %}
                <img
                    src="{{ article.image.url }}"
                    alt="{{ article.title }}"
                    loading="lazy"
                >
            {% endif %}

            <h3>{{ article.title }}</h3>

            <div class="article-card-meta">
                <span class="article-card-genre">
                    {{ article.get_genre_display }}
                </span>

                <span class="article-card-category">
                    {{ article.get_category_display }}
                </span>
            </div>

            <p>作者：{{ article.author.username }}</p>

            <p>投稿日：{{ article.created_at|date:"Y年m月d日" }}</p>

        </article>

    </a>

{% endfor %}
