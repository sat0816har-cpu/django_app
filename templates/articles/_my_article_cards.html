{% load static %}
{% for article in articles %}

    <div class="article-card-wrapper">

        <a href="/articles/{{ article.id }}/?from=my-articles"
           class="article-card-link">

            <article class="article-card">

                
                {% if article.image %}
                    <img
                        src="{{ article.image.url }}"
                        alt="{{ article.title }}"
                        loading="lazy"
                    >
                {% else %}
                    <img
                        src="{% static 'images/default_article.jpg' %}"
                        alt="記事のイメージ画像"
                        loading="lazy"
                    >
                {% endif %}


                <h3>{{ article.title }}</h3>

                <div class="post-card-meta">
                    <span class="article-card-genre">
                        {{ article.get_genre_display }}
                    </span>

                    <span class="article-card-category">
                        {{ article.get_category_display }}
                    </span>
                </div>

                <p>{{ article.author.username }}</p>

                <p>{{ article.created_at|date:"Y年m月d日" }}</p>

            </article>

        </a>

        <div class="post-card-likes">

            <input
                type="hidden"
                class="csrf-token"
                value="{{ csrf_token }}"
            >

            <button
                type="button"
                class="like-button"
                data-like-url="{% url 'article_like' article.id %}"
                aria-label="この記事にいいね"
            >
                <span class="like-heart">♡</span>
                <span class="like-label">いいね</span>
                <span class="like-count">{{ article.like_count }}</span>
            </button>

        </div>

    </div>

{% endfor %}
