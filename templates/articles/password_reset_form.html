
{% extends "base.html" %}

{% block content %}

<style>
    .password-reset-container {
        max-width: 480px;
        margin: 40px auto;
        padding: 24px;
        background: #fff;
        border: 1px solid #ddd;
        border-radius: 12px;
        box-sizing: border-box;
    }

    .password-reset-container h2 {
        margin-top: 0;
        margin-bottom: 16px;
        font-size: 22px;
        text-align: center;
    }

    .password-reset-container p {
        line-height: 1.8;
        color: #555;
    }

    .password-reset-container label {
        display: block;
        margin-bottom: 8px;
        font-weight: bold;
    }

    .password-reset-container input[type="email"] {
        width: 100%;
        padding: 12px;
        margin-bottom: 16px;
        border: 1px solid #ccc;
        border-radius: 6px;
        box-sizing: border-box;
        font-size: 16px;
    }

    .password-reset-container button {
        width: 100%;
        padding: 12px;
        background: #2563eb;
        color: white;
        border: none;
        border-radius: 6px;
        font-size: 16px;
        cursor: pointer;
    }

    .password-reset-container button:hover {
        background: #1d4ed8;
    }

    .password-reset-back {
        margin-top: 20px;
        text-align: center;
    }

.password-reset-back a.password-reset-login-button {
    display: block;
    width: 100%;
    padding: 13px;
    margin-top: 5px;
    border: 1px solid #2563eb;
    border-radius: 8px;
    background: #ffffff;
    color: #2563eb;
    font-size: 16px;
    font-weight: bold;
    text-align: center;
    text-decoration: none;
    box-sizing: border-box;
}

.password-reset-back a.password-reset-login-button:hover {
    background: #f8fafc;
}

.password-reset-back a {
    text-decoration: none;
}
</style>

<div class="password-reset-container">

    <h2>パスワードを再設定</h2>

    <p>
        会員登録したメールアドレスを入力してください。
        パスワードを再設定するための案内をお送りします。
    </p>

    <form method="post">
        {% csrf_token %}

        <label for="email">メールアドレス</label>

        <input
            type="email"
            id="email"
            name="email"
            required
            autocomplete="email"
            placeholder="登録したメールアドレス"
        >

        <button type="submit">
            再設定用メールを送信
        </button>
    </form>

    <div class="password-reset-back">
        <a href="{% url 'login' %}" class="password-reset-login-button">
    ログイン画面に戻る
</a>
    </div>

</div>

{% endblock %}
