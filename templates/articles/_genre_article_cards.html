{% for article in articles %}
    <article class="post-card">

        <a href="/articles/{{ article.id }}/" class="post-card-link">

            {% if article.image %}
                <img
                    src="{{ article.image.url }}"
                    alt="{{ article.title }}"
                    class="post-image"
                >
            {% endif %}

            <div class="post-card-body">
                <h2 class="post-card-title">{{ article.title }}</h2>

                <p class="post-author">
                    投稿者：{{ article.author.username }}
                </p>

                <p class="post-date">
                    {{ article.created_at|date:"Y年n月j日" }}
                </p>
            </div>

        </a>

        <div class="post-card-likes">
            <input
                type="hidden"
                class="csrf-token"
                value="{{ csrf_token }}"
            >

            <button
                type="button"
                class="like-button"
                data-like-url="{% url 'article_like' article.id %}"
                aria-label="この記事にいいね"
            >
                <span class="like-heart">♡</span>
                <span class="like-label">いいね</span>
                <span class="like-count">{{ article.like_count }}</span>
            </button>
        </div>

    </article>
{% endfor %}
