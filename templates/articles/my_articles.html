
{% extends "base.html" %}

{% block content %}

<h2>{{ user.username }}さんの投稿</h2>

<hr>

<div class="my-articles-grid">

    {% for article in articles %}

        <a href="/article/{{ article.id }}/"
           class="article-card-link">

            <article class="article-card">

                {% if article.image %}
                    <img
                        src="{{ article.image.url }}"
                        alt="{{ article.title }}"
                    >
                {% endif %}

                <h3>
                    {{ article.title }}
                </h3>

                <p>
                    作者：
                    {{ article.author.username }}
                </p>

                <p>
                    投稿日：
                    {{ article.created_at|date:"Y年m月d日" }}
                </p>

            </article>

        </a>

    {% empty %}

        <p>まだ投稿した記事はありません。</p>

    {% endfor %}

</div>

{% endblock %}
