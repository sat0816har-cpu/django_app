
{% extends "base.html" %}

{% block content %}

{% if article %}
    <h2>記事を編集する</h2>
{% else %}
    <h2>新しい記事を書く</h2>
{% endif %}

<form method="post" enctype="multipart/form-data">

    {% csrf_token %}

    <p>
        <label>タイトル</label>
    </p>
    <p>
        <input type="text" name="title" value="{{ article.title|default:'' }}" required style="width: 100%; box-sizing: border-box;">
    </p>

    <p>
        <label>本文</label>
    </p>
    <p>
        <textarea name="content" rows="10" cols="50" required style="width: 100%; box-sizing: border-box;"></textarea>
    </p>

    
    <p>
        <label>ジャンル</label>
    </p>
    <p>
        <select name="genre" required>
            <option value="hobby" {% if article.genre == "hobby" %}selected{% endif %}>趣味・エンタメ</option>
            <option value="people" {% if article.genre == "people" %}selected{% endif %}>人・社会</option>
            <option value="life" {% if article.genre == "life" %}selected{% endif %}>暮らし</option>
            <option value="learning" {% if article.genre == "learning" %}selected{% endif %}>学び・仕事</option>
            <option value="creative" {% if article.genre == "creative" %}selected{% endif %}>創作・表現</option>
            <option value="other" {% if not article or article.genre == "other" %}selected{% endif %}>その他</option>
        </select>
    </p>


    <p>
        <label>カテゴリー</label>
    </p>
    <p>
        <select name="category" required>
            <option value="music" {% if article.category == "music" %}selected{% endif %}>音楽</option>
            <option value="movie" {% if article.category == "movie" %}selected{% endif %}>映画</option>
            <option value="book" {% if article.category == "book" %}selected{% endif %}>読書</option>
            <option value="photo" {% if article.category == "photo" %}selected{% endif %}>写真</option>
            <option value="travel" {% if article.category == "travel" %}selected{% endif %}>旅行</option>
            <option value="cooking" {% if article.category == "cooking" %}selected{% endif %}>料理</option>
            <option value="other" {% if not article or article.category == "other" %}selected{% endif %}>その他</option>
        </select>
    </p>

    <p>
        <label>画像</label>
    </p>
    <p>
        <input type="file" name="image" accept="image/*">
    </p>

    {% if article and article.image %}
        <p>現在の画像：{{ article.image.name }}</p>
    {% endif %}

    <hr>

    <p>
        <label>YouTube動画のURL（任意）</label>
    </p>
    <p>
        <input
            type="url"
            name="youtube_url"
            value="{{ article.youtube_url|default:'' }}"
            placeholder="https://www.youtube.com/watch?v=..."
        >
    </p>
    <p>
        YouTube動画を紹介したい場合は、動画のURLを入力してください。
    </p>

    <button type="submit">保存する</button>

</form>

<div class="detail-actions">
    <button
        class="detail-button detail-back"
        type="button"
        onclick="if (document.referrer) { try { const previous = new URL(document.referrer); if (previous.origin === window.location.origin) { window.history.back(); return; } } catch (e) {} } window.location.href = '/';"
    >
        ← 戻る
    </button>
</div>

{% endblock %}
