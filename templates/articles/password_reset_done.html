
{% extends "base.html" %}

{% block content %}

<style>
    .password-reset-container {
        max-width: 480px;
        margin: 40px auto;
        padding: 24px;
        background: #fff;
        border: 1px solid #ddd;
        border-radius: 12px;
        box-sizing: border-box;
        text-align: center;
    }

    .password-reset-container h2 {
        margin-top: 0;
        margin-bottom: 16px;
        font-size: 22px;
    }

    .password-reset-container p {
        line-height: 1.9;
        color: #555;
    }

    .password-reset-button {
        display: inline-block;
        margin-top: 16px;
        padding: 12px 24px;
        background: #2563eb;
        color: #fff;
        text-decoration: none;
        border-radius: 6px;
    }

    .password-reset-button:hover {
        background: #1d4ed8;
    }
</style>

<div class="password-reset-container">

    <h2>メール送信のご案内</h2>

    <p>
        登録済みのメールアドレスであれば、
        パスワード再設定の案内を送信しました。
    </p>

    <p>
        メールが届かない場合は、
        迷惑メールフォルダも確認してください。
    </p>

    <a
        href="{% url 'login' %}"
        class="password-reset-button"
    >
        ログイン画面に戻る
    </a>

</div>

{% endblock %}
