
{% extends "base.html" %}

{% load static %}

{% block content %}

<div class="feed-header">
    <h2 class="feed-title">最近人気の記事 TOP 10</h2>
    <p>直近7日間に「いいね」された記事をランキング表示します。</p>
</div>



<style>
    .recent-ranking-list {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 12px;
        width: 100%;
        max-width: 1200px;
        margin: 20px auto;
    }

    .recent-ranking-item {
        position: relative;
        min-width: 0;
    }

    .recent-ranking-rank {
        position: absolute;
        top: 6px;
        left: 6px;
        z-index: 2;
        padding: 4px 7px;
        border: 1px solid #ddd;
        border-radius: 6px;
        background: #fff;
        font-size: 12px;
        font-weight: bold;
    }

    .recent-ranking-card {
        min-width: 0;
        width: 100%;
        padding: 0;
        border: none;
    }

    @media (max-width: 600px) {
        .recent-ranking-list {
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 10px;
        }
    }

    
    /* 最近人気ランキングだけPC横5列 */
    .recent-ranking-page .ranking-list {
        grid-template-columns: repeat(5, minmax(0, 1fr));
    }

    /* スマホは今までどおり横2列 */
    @media (max-width: 600px) {
        .recent-ranking-page .ranking-list {
            grid-template-columns: repeat(2, minmax(0, 1fr));
        }
    }

</style>



<div class="recent-ranking-page">
    {% include "articles/_ranking_cards.html" with articles=articles %}
</div>


<div class="ranking-back">
    <a href="/">トップページへ戻る</a>
</div>

{% endblock %}
