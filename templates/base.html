
{% load static %}
<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>すきつな｜好きでつながる。世界が広がる。</title>

    <link rel="stylesheet" href="{% static 'style.css' %}">
</head>

<body>

<div class="container">

    <header class="site-header">

        <div class="site-brand">
            <h1 class="site-title">
                <a href="/">すきつな</a>
            </h1>

            <p class="site-tagline">
                好きでつながる。世界が広がる。
            </p>
        </div>

        <nav class="user-menu">

            {% if user.is_authenticated %}

                <span>{{ user.username }}さん</span>
                <a href="/logout/">ログアウト</a>

            {% else %}

                <a href="/register/">ユーザー登録</a>
                <a href="/login/">ログイン</a>

            {% endif %}

            <a href="/private-users/">登録ユーザー一覧</a>

        </nav>

    </header>

    <hr>

    <main>
        {% block content %}
        {% endblock %}
    </main>

</div>

</body>
</html>
