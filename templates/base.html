{% load static %}
<!DOCTYPE html>
<html>

<head>

    <meta charset="UTF-8">

    <title>Djangoブログ</title>

    <link rel="stylesheet" href="{% static 'style.css' %}">

</head>

<body>

<div class="container">

<header>

    <h1 class="site-title">
        <a href="/">
            Djangoブログ
        </a>
    </h1>

    {% if user.is_authenticated %}

        <p>
            {{ user.username }}さん
        </p>

        <p>
            <a href="/logout/">
                ログアウト
            </a>
        </p>

    {% else %}

        <p>
            <a href="/register/">
                ユーザー登録
            </a>
        </p>

        <p>
            <a href="/login/">
                ログイン
            </a>
        </p>

    
　　　　　<p>
    　　　　 <a href="/private-users/">
            登録ユーザー一覧
       　　 </a>
　　　　　</p>


    {% endif %}

</header>

<hr>

<main>

    {% block content %}
    {% endblock %}

</main>

</div>

</body>

</html>
